# Toute PR renvoie vers au moins une étape du « 🗺️ Suivi du projet » dans Notion.
# Workflow à part de la CI : il se relance quand on modifie la description de la PR, sans
# relancer les tests.
name: Lien Notion

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  lien-notion:
    name: Étape Notion liée
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Chercher un lien Notion dans la description
        # Les mises à jour de dépendances de Dependabot ne correspondent à aucune étape.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        # La description passe par une variable d'environnement, jamais interpolée dans le
        # script : un texte de PR ne doit pas pouvoir s'exécuter.
        env:
          DESCRIPTION: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$DESCRIPTION" | grep -Eq 'https://(app\.notion\.com|(www\.)?notion\.so)/[^ )]*[0-9a-f]{32}'; then
            echo "Étape Notion trouvée."
          else
            echo "::error::La description de la PR doit contenir le lien d'au moins une étape Notion (section « Étapes Notion »)."
            exit 1
          fi
