# Mises à jour automatiques : une PR par semaine et par écosystème, groupées pour limiter le bruit.
# Les PR de sécurité de GitHub partent toujours à part, sans attendre ce calendrier.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # typescript-eslint n'accepte pas encore TypeScript 7 (peer < 6.1.0) : on reste en 6.x.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      dependances:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
